/*
 * This file was generated by the Gradle 'init' task.
 *
 * This generated file contains a sample Java application project to get you started.
 * For more details on building Java & JVM projects, please refer to https://docs.gradle.org/8.14.1/userguide/building_java_projects.html in the Gradle documentation.
 */

plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation 'com.google.guava:guava:31.1-jre'
    implementation 'org.mindrot:jbcrypt:0.4'
    implementation 'org.xerial:sqlite-jdbc:3.45.1.0'

    // sqlite-jdbc pulls in slf4j-api:1.7.36 with no binding, which prints a
    // "no SLF4J providers were found" warning at startup. Provide the simple
    // binding at the matching 1.7.x line so it resolves without a version clash.
    runtimeOnly 'org.slf4j:slf4j-simple:1.7.36'
}

javafx {
    version = "21" // Use the JavaFX version matching your JDK
    // javafx.swing is needed only by the screenshot tool, for SwingFXUtils.
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.web', 'javafx.swing' ]
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'com.owo.App'
}

// Seed the database with sample flights, hotels and a demo account.
// Idempotent: re-running leaves row counts unchanged.
tasks.register('seed', JavaExec) {
    group = 'application'
    description = 'Seed the database with sample data (idempotent)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.owo.utils.TestDataInserter'
}

// Render every screen to build/screenshots. Needs a display. Nothing else in the build
// can see whether a screen actually looks right, only whether its markup is present.
tasks.register('screenshots', JavaExec) {
    group = 'application'
    description = 'Render each screen to a PNG in build/screenshots (needs a display)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.owo.demo.ScreenshotTool'
}

tasks.register('searchDemo', JavaExec) {
    group = 'application'
    description = 'Exercise flight and hotel search without the UI'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.owo.demo.SearchDemo'
}

// Point every launched JVM at the project's own database. Without this the app
// resolves to ~/.owo/owo.db, which is correct for an installed copy but not for
// development against the checked-in file.
tasks.withType(JavaExec).configureEach {
    systemProperty 'owo.db.path', file('owo.db').absolutePath
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()

    // BridgeLiveTest drives a real WebView and needs a display, so it is opt-in:
    //   ./gradlew test -Powo.live=true
    // The reflective bridge contract test runs unconditionally.
    if (project.hasProperty('owo.live')) {
        systemProperty 'owo.live', 'true'

        // Asking for the live tests and getting a green run without them is the failure
        // that matters. They are skipped rather than failed when the toolkit cannot
        // start, so a CI runner missing a display or a WebKit library produces a passing
        // job with eighteen fewer tests in it — and nobody counts tests on a green run.
        def liveTestsRan = new java.util.concurrent.atomic.AtomicInteger()
        afterTest { descriptor, result ->
            if (descriptor.className == 'com.owotest.BridgeLiveTest'
                    && result.resultType.toString() != 'SKIPPED') {
                liveTestsRan.incrementAndGet()
            }
        }
        doLast {
            if (liveTestsRan.get() == 0) {
                throw new GradleException('-Powo.live=true was requested but no '
                        + 'BridgeLiveTest test ran. The WebView tests were skipped, which '
                        + 'usually means no display (run under xvfb-run) or a missing '
                        + 'WebKit dependency. Passing without them is not a pass.')
            }
        }
    }
}

tasks.withType(JavaExec) {
    jvmArgs += ['--add-opens', 'java.base/java.lang=ALL-UNNAMED']
}

tasks.withType(Test) {
    jvmArgs += ['--add-opens', 'java.base/java.lang=ALL-UNNAMED']
}

// Disable configuration cache for JavaFX tasks
tasks.withType(JavaExec).configureEach {
    notCompatibleWithConfigurationCache("JavaFX tasks are not compatible with configuration cache")
}

// Disable configuration cache for test tasks
tasks.withType(Test).configureEach {
    notCompatibleWithConfigurationCache("Test tasks are not compatible with configuration cache")
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}