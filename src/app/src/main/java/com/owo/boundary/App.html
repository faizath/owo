<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Booking App</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        .data-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 300px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            z-index: 1000;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .data-panel h3 {
            color: #667eea;
            margin-top: 0;
            border-bottom: 2px solid #667eea;
            padding-bottom: 5px;
        }
        
        .data-item {
            margin: 10px 0;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 5px;
            font-size: 12px;
        }
        
        .data-item strong {
            color: #495057;
        }
        
        .clear-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
        }
        
        .clear-btn:hover {
            background: #c82333;
        }
        
        .toggle-btn {
            position: fixed;
            top: 10px;
            right: 320px;
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1001;
        }
        
        .data-panel.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Data Panel untuk menampilkan data yang tersimpan
    <button class="toggle-btn" onclick="toggleDataPanel()">Toggle Data Panel</button>
    <div class="data-panel" id="dataPanel">
        <h3>Data Tersimpan</h3>
        <div id="dataContent">
            <p>Belum ada data tersimpan.</p>
        </div>
        <button class="clear-btn" onclick="clearAllData()">Hapus Semua Data</button>
    </div> -->

    <!-- Iframe untuk Pemesanan.html -->
    <iframe 
        id="pemesananIframe"
        src="/src/app/src/main/java/com/owo/boundary/Pemesanan.html" 
        style="height: 100vh; width: 100vw; border: none; overflow-x:hidden"
        onload="setupIframeListener()">
    </iframe>

    <script>
        // Object untuk menyimpan semua data aplikasi (struktur diubah)
        window.travelAppData = {
            hotelBooking: null,
            flightBooking: null,
            searchHistory: {
                hotel: null,
                flight: null
            },
            userPreferences: {},
            favorites: {
                hotel: null,
                flight: null
            }
        };
    
        // Fungsi untuk menyimpan data (logika diubah untuk menimpa data)
        function saveData(type, data) {
            const timestamp = new Date().toISOString();
            const dataWithTimestamp = {
                ...data,
                timestamp: timestamp,
                id: Date.now() + Math.random()
            };
        
            // Pastikan objek utama ada
            if (!window.travelAppData) {
                // Inisialisasi ulang jika hilang total (sangat defensif)
                window.travelAppData = { hotelBooking: null, flightBooking: null, searchHistory: {}, userPreferences: {}, favorites: {} };
            }
        
            switch(type) {
                case 'hotel_search':
                    // PERIKSA & BUAT JIKA searchHistory TIDAK ADA
                    if (!window.travelAppData.searchHistory) {
                        window.travelAppData.searchHistory = { hotel: null, flight: null };
                    }
                    window.travelAppData.searchHistory.hotel = dataWithTimestamp;
                    break;
        
                case 'flight_search':
                    // PERIKSA & BUAT JIKA searchHistory TIDAK ADA
                    if (!window.travelAppData.searchHistory) {
                        window.travelAppData.searchHistory = { hotel: null, flight: null };
                    }
                    window.travelAppData.searchHistory.flight = dataWithTimestamp;
                    break;
        
                case 'hotel_booking':
                    window.travelAppData.hotelBooking = dataWithTimestamp;
                    break;
        
                case 'flight_booking':
                    window.travelAppData.flightBooking = dataWithTimestamp;
                    break;
        
                case 'hotel_favorite':
                     // PERIKSA & BUAT JIKA favorites TIDAK ADA
                    if (!window.travelAppData.favorites) {
                        window.travelAppData.favorites = { hotel: null, flight: null };
                    }
                    window.travelAppData.favorites.hotel = dataWithTimestamp;
                    break;
        
                case 'flight_favorite':
                     // PERIKSA & BUAT JIKA favorites TIDAK ADA
                    if (!window.travelAppData.favorites) {
                        window.travelAppData.favorites = { hotel: null, flight: null };
                    }
                    window.travelAppData.favorites.flight = dataWithTimestamp;
                    break;
        
                case 'user_preference':
                    // PERIKSA & BUAT JIKA userPreferences TIDAK ADA
                    if (!window.travelAppData.userPreferences) {
                        window.travelAppData.userPreferences = {};
                    }
                    window.travelAppData.userPreferences = {
                        ...window.travelAppData.userPreferences,
                        ...dataWithTimestamp
                    };
                    break;
            }
            
            // Update tampilan data panel
            updateDataPanel();
            
            // Log untuk debugging
            console.log('Data saved (overwritten):', type, dataWithTimestamp);
            console.log('Current app data:', window.travelAppData);
        }
    
        // Fungsi untuk mengambil data (disesuaikan dengan struktur baru)
        function getData(type) {
            switch(type) {
                case 'all':
                    return window.travelAppData;
                case 'hotel_booking': // nama disesuaikan
                    return window.travelAppData.hotelBooking;
                case 'flight_booking': // nama disesuaikan
                    return window.travelAppData.flightBooking;
                case 'search_history':
                    return window.travelAppData.searchHistory;
                case 'favorites':
                    return window.travelAppData.favorites;
                case 'user_preferences':
                    return window.travelAppData.userPreferences;
                default:
                    return null;
            }
        }
    
        // Fungsi untuk menghapus data (logika diubah)
        function clearData(type) {
            // DIUBAH: Mengatur ulang properti menjadi null atau object kosong
            switch(type) {
                case 'all':
                    window.travelAppData = {
                        hotelBooking: null,
                        flightBooking: null,
                        searchHistory: { hotel: null, flight: null },
                        userPreferences: {},
                        favorites: { hotel: null, flight: null }
                    };
                    break;
                case 'hotel_bookings': // tetap menggunakan nama jamak untuk konsistensi event
                    window.travelAppData.hotelBooking = null;
                    break;
                case 'flight_bookings':
                    window.travelAppData.flightBooking = null;
                    break;
                case 'search_history':
                    window.travelAppData.searchHistory = { hotel: null, flight: null };
                    break;
                case 'favorites':
                    window.travelAppData.favorites = { hotel: null, flight: null };
                    break;
            }
            updateDataPanel();
        }
    
        // Setup listener untuk komunikasi dengan iframe (tidak perlu diubah)
        function setupIframeListener() {
            window.addEventListener('message', function(event) {
                if (event.source !== document.getElementById('pemesananIframe').contentWindow) {
                    return;
                }
                const { action, type, data } = event.data;
                switch(action) {
                    case 'save_data':
                        saveData(type, data);
                        break;
                    case 'get_data':
                        event.source.postMessage({
                            action: 'data_response',
                            type: type,
                            data: getData(type)
                        }, '*');
                        break;
                    case 'clear_data':
                        clearData(type);
                        break;
                }
            });
        }
    
        // Fungsi untuk mengupdate tampilan data panel (logika diubah total)
        function updateDataPanel() {
            const dataContent = document.getElementById('dataContent');
            const data = window.travelAppData;
            
            if (isDataEmpty(data)) {
                dataContent.innerHTML = '<p>Belum ada data tersimpan.</p>';
                return;
            }
    
            let html = '';
    
            // DIUBAH: Menampilkan data tunggal, bukan loop
            if (data.searchHistory.hotel || data.searchHistory.flight) {
                html += '<h4>Riwayat Pencarian Terakhir:</h4>';
                if(data.searchHistory.hotel) {
                    const search = data.searchHistory.hotel;
                    html += `
                        <div class="data-item">
                            <strong>Hotel:</strong><br>
                            ${search.destination || 'N/A'} - ${search.checkin || 'N/A'}<br>
                            <small>${new Date(search.timestamp).toLocaleString()}</small>
                        </div>
                    `;
                }
                if(data.searchHistory.flight) {
                    const search = data.searchHistory.flight;
                    html += `
                        <div class="data-item">
                            <strong>Pesawat:</strong><br>
                            ${search.from || 'N/A'} → ${search.to || 'N/A'}<br>
                            <small>${new Date(search.timestamp).toLocaleString()}</small>
                        </div>
                    `;
                }
            }
    
            if (data.hotelBooking) {
                html += '<h4>Booking Hotel Terakhir:</h4>';
                const booking = data.hotelBooking;
                html += `
                    <div class="data-item">
                        <strong>${booking.hotelName || 'Hotel'}</strong><br>
                        ${booking.destination || 'N/A'}<br>
                        <small>${new Date(booking.timestamp).toLocaleString()}</small>
                    </div>
                `;
            }
    
            if (data.flightBooking) {
                html += '<h4>Booking Pesawat Terakhir:</h4>';
                const booking = data.flightBooking;
                html += `
                    <div class="data-item">
                        <strong>${booking.flightName || 'Flight'}</strong><br>
                        ${booking.from || 'N/A'} → ${booking.to || 'N/A'}<br>
                        <small>${new Date(booking.timestamp).toLocaleString()}</small>
                    </div>
                `;
            }
    
            if (data.favorites.hotel || data.favorites.flight) {
                html += '<h4>Favorit Terakhir:</h4>';
                if(data.favorites.hotel) {
                    const fav = data.favorites.hotel;
                     html += `
                        <div class="data-item">
                            <strong>♥ ${fav.name || 'Favorit Hotel'}</strong><br>
                            <small>${new Date(fav.timestamp).toLocaleString()}</small>
                        </div>
                    `;
                }
                if(data.favorites.flight) {
                    const fav = data.favorites.flight;
                     html += `
                        <div class="data-item">
                            <strong>♥ ${fav.name || 'Favorit Pesawat'}</strong><br>
                            <small>${new Date(fav.timestamp).toLocaleString()}</small>
                        </div>
                    `;
                }
            }
    
            dataContent.innerHTML = html;
        }
    
        // Fungsi helper untuk mengecek apakah data kosong (logika diubah)
        function isDataEmpty(data) {
            return data.hotelBooking === null && 
                   data.flightBooking === null && 
                   data.searchHistory.hotel === null && 
                   data.searchHistory.flight === null &&
                   data.favorites.hotel === null && 
                   data.favorites.flight === null &&
                   Object.keys(data.userPreferences).length === 0;
        }
    
        // --- Fungsi lainnya tidak perlu diubah ---
    
        function toggleDataPanel() {
            const panel = document.getElementById('dataPanel');
            panel.classList.toggle('hidden');
        }
    
        function clearAllData() {
            if (confirm('Apakah Anda yakin ingin menghapus semua data?')) {
                clearData('all');
            }
        }
    
        function exportData() {
            const dataStr = JSON.stringify(window.travelAppData, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'travel_app_data.json';
            link.click();
            URL.revokeObjectURL(url);
        }
    
        function importData(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        window.travelAppData = importedData;
                        updateDataPanel();
                        alert('Data berhasil diimport!');
                    } catch (error) {
                        alert('Error importing data: ' + error.message);
                    }
                };
                reader.readAsText(file);
            }
        }
    
        // Expose functions to global scope
        window.travelApp = {
            saveData: saveData,
            getData: getData,
            clearData: clearData,
            exportData: exportData,
            importData: importData,
            data: window.travelAppData
        };
    
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            updateDataPanel();
            console.log('Travel App initialized with single-entry data structure.');

            setupIframeListener(); 
            console.log('Travel App initialized and listener is set up.');
        });

        function setupIframeListener() {
            window.addEventListener('message', function(event) {
                // Pastikan pesan datang dari iframe yang benar
                // PASTIKAN ID IFRAME ANDA ADALAH 'pemesananIframe'
                if (event.source !== document.getElementById('pemesananIframe').contentWindow) {
                    return;
                }
    
                const { action, type, data } = event.data;
    
                switch(action) {
                    case 'save_data':
                        saveData(type, data);
                        break;
                    case 'get_data':
                        // Kirim data kembali ke iframe
                        console.log('Parent received get_data request for:', type); // Tambahan log untuk debug
                        const responseData = getData(type);
                        event.source.postMessage({
                            action: 'data_response',
                            type: type,
                            data: responseData
                        }, '*');
                        break;
                    case 'clear_data':
                        clearData(type);
                        break;
                }
            });
            console.log('Parent listener is now active.'); // Tambahan log untuk memastikan fungsi dipanggil
        }

    </script>
</body>
</html>
