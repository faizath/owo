name: Build and test

on:
  push:
    branches: [ showcase ]
  pull_request:
    branches: [ showcase ]

# A newer push supersedes the run already in flight for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The daemon JVM criteria in src/gradle/gradle-daemon-jvm.properties ask for
      # Java 21 with no vendor pin, which this satisfies without Gradle having to
      # provision a toolchain over the network.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      # BridgeLiveTest drives a real WebView, so it needs a display and the GTK/GL
      # libraries JavaFX's WebKit links against. Without them the live tests are
      # skipped rather than failed — and they are the only layer that exercises the
      # page through the controls a user actually has.
      - name: Install a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libgl1 libxtst6

      # `build` already runs `check` → `test`, so this is the whole suite in one
      # pass; -Powo.live=true opts the WebView tests in. Running `test` separately
      # afterwards adds no coverage and costs a full reconfiguration, because the
      # configuration cache is never stored while a Test task is in the graph.
      - name: Build and test
        working-directory: src
        run: xvfb-run --auto-servernum ./gradlew build -Powo.live=true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            src/app/build/reports/tests/test
            src/app/build/test-results/test
          retention-days: 7
